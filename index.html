<script>
    const catalogGrid = document.getElementById('catalog-grid');
    const fallbackPlaylistData = JSON.parse(document.getElementById('playlist-casas-data').textContent);

    function buildCard(video, index) {
        const number = video.numero || index + 1;
        const title = (video.titulo || video.nome || `Casa ${number}`).replace(/\s+/g, ' ').trim();
        const image = video.thumbnailMaxRes || video.thumbnail || '';

        return `
            <article class="casa">
                <div class="nome">
                    <span class="numero">${number}</span>
                    <span>${title}</span>
                </div>
                <div class="imagem">
                    <img src="${image}" alt="${title}" loading="lazy" />
                </div>
            </article>
        `;
    }

    function renderCatalogo(playlistData) {
        const videos = Array.isArray(playlistData?.videos) ? playlistData.videos : [];
        const validVideos = videos.filter((video) => video && (video.thumbnailMaxRes || video.thumbnail));

        catalogGrid.innerHTML = validVideos.length
            ? validVideos.map((video, index) => buildCard(video, index)).join('')
            : '<div class="empty-state">Nenhuma imagem foi encontrada na playlist informada.</div>';
    }

    async function carregarPlaylist() {
        try {
            const resposta = await fetch('./playlist-casas-sdesign.json', { cache: 'no-store' });
            if (!resposta.ok) {
                throw new Error('Playlist não encontrada');
            }
            const dados = await resposta.json();
            renderCatalogo(dados);
        } catch (error) {
            console.warn('Usando fallback da playlist embutida:', error);
            renderCatalogo(fallbackPlaylistData);
        }
    }

    carregarPlaylist();

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("./sw.js").catch(function (error) {
                console.warn("Service Worker não pôde ser registrado:", error);
            });
        });
    }

    async function carregarContador() {
        const contadorEl = document.getElementById("visitas-valor");
        if (!contadorEl) return;

        try {
            const resposta = await fetch("https://api.countapi.xyz/hit/casas3d-github-pages/visitas?output=json", {
                cache: "no-store"
            });

            if (!resposta.ok) {
                throw new Error("Falha ao carregar contador");
            }

            const dados = await resposta.json();
            const valor = Number(dados?.value ?? 0);
            contadorEl.textContent = Number.isFinite(valor) ? valor.toLocaleString("pt-BR") : "N/D";
        } catch (error) {
            contadorEl.textContent = "N/D";
        }
    }

    carregarContador();
</script>
