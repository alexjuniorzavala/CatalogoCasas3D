<script>
    const catalogGrid = document.getElementById('catalog-grid');
    const fallbackPlaylistData = JSON.parse(document.getElementById('playlist-casas-data').textContent);

    function normalizeThumbnailTitle(value) {
        return String(value || '')
            .normalize('NFKC')
            .replace(/\s*\|\s*/g, ' _ ')
            .replace(/\s*[_\uFF5C]\s*/g, ' _ ')
            .replace(/[\\/]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function getLocalThumbnailUrl(video, fallbackTitle = '') {
        if (!video) return '';

        const numero = Number(video.numero ?? 0);
        const title = normalizeThumbnailTitle(video.titulo || video.nome || fallbackTitle || `Casa ${numero}`);

        if (!title) return '';

        const directPath = `./thumbnailsYT/${encodeURI(title)}.jpg`;
        const numberedPath = numero ? `./thumbnailsYT/${String(numero).padStart(3, '0')} - ${encodeURI(title)}.jpg` : directPath;

        return `${directPath}`;
    }

    function buildCard(video, index) {
        const number = video.numero || index + 1;
        const title = (video.titulo || video.nome || `Casa ${number}`).replace(/\s+/g, ' ').trim();
        const localImage = getLocalThumbnailUrl(video, title);
        const fallbackImage = video.thumbnailMaxRes || video.thumbnail || '';

        return `
            <article class="casa">
                <div class="nome">
                    <span class="numero">${number}</span>
                    <span>${title}</span>
                </div>
                <div class="imagem">
                    <img src="${localImage}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImage || localImage}';" />
                </div>
            </article>
        `;
    }

    function renderCatalogo(playlistData) {
        const videos = Array.isArray(playlistData?.videos) ? playlistData.videos : [];
        const validVideos = videos.filter((video) => video && (video.numero || video.titulo || video.nome));

        catalogGrid.innerHTML = validVideos.length
            ? validVideos.map((video, index) => buildCard(video, index)).join('')
            : '<div class="empty-state">Nenhuma imagem foi encontrada na playlist informada.</div>';
    }

    async function carregarPlaylist() {
        try {
            const resposta = await fetch('./playlist-casas-sdesign.json', { cache: 'no-store' });
            if (!resposta.ok) {
                throw new Error('Playlist não encontrada');
            }
            const dados = await resposta.json();
            renderCatalogo(dados);
        } catch (error) {
            console.warn('Usando fallback da playlist embutida:', error);
            renderCatalogo(fallbackPlaylistData);
        }
    }

    carregarPlaylist();

    const SERVICE_WORKER_CACHE_KEY = "casas3d-sdesign-v2";

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register(`./sw.js?key=${SERVICE_WORKER_CACHE_KEY}`).catch(function (error) {
                console.warn("Service Worker não pôde ser registrado:", error);
            });

            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                registrations.forEach(function (registration) {
                    if (!registration.active || !registration.active.scriptURL.includes(SERVICE_WORKER_CACHE_KEY)) {
                        registration.unregister().catch(function () {});
                    }
                });
            }).catch(function () {});
        });
    }

    async function carregarContador() {
        const contadorEl = document.getElementById("visitas-valor");
        if (!contadorEl) return;

        try {
            const resposta = await fetch("https://api.countapi.xyz/hit/casas3d-github-pages/visitas?output=json", {
                cache: "no-store"
            });

            if (!resposta.ok) {
                throw new Error("Falha ao carregar contador");
            }

            const dados = await resposta.json();
            const valor = Number(dados?.value ?? 0);
            contadorEl.textContent = Number.isFinite(valor) ? valor.toLocaleString("pt-BR") : "N/D";
        } catch (error) {
            contadorEl.textContent = "N/D";
        }
    }

    carregarContador();
</script>
